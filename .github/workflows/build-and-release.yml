name: Build and Release

# CI verification for tagged releases: run the unit tests + a full release
# build (the preBuild hook also enforces the trilingual string parity check).
#
# The published release APK is deliberately NOT built here: it must be signed
# with the maintainer's local debug keystore so users can upgrade in place,
# while a CI runner would auto-generate a random debug key whose APK could
# never be installed over existing installs. Releases are therefore published
# by hand (`gh release create` with the locally built APK); this workflow only
# proves that the tag builds green.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Ubuntu runners ship a preinstalled Android SDK with licenses
      # pre-accepted; AGP auto-installs the platform / build-tools versions
      # this project declares, so no explicit SDK setup step is needed.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test (tag verification)
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiRecall-release
          path: app/build/outputs/apk/release/app-release.apk
